{% extends "base.html" %}
{% block title %}إنشاء حساب | أنيس{% endblock %}
{% block content %}

<div class="auth-page">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-logo">أ</div>
            <h1>أنيس</h1>
            <p>تعلم العربية .. ممتع وسهل</p>
        </div>

        <div class="auth-content">
            <h2>مرحبًا بك! 🌟</h2>
            <p class="auth-subtitle">أنشئ حسابك وابدأ رحلة تعلم العربية</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">الاسم</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👋</span>
                        <input type="text" id="name" name="name" placeholder="اكتب اسمك">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="اختر اسم مستخدم" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="اختر كلمة مرور" required>
                    </div>
                </div>

                <div id="registerMessage" class="form-message"></div>
                <button type="submit" class="btn btn-primary btn-full">إنشاء الحساب</button>
            </form>

            <div class="auth-switch">لديك حساب بالفعل؟<a href="{{ url_for('login') }}">تسجيل الدخول</a></div>

        </div>
    </div>
</div>

{% endblock %}
