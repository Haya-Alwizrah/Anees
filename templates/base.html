<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}أنيس{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->
    <nav class="bottom-nav">
        <a href="{{ url_for('home') }}" class="nav-item {% if request.endpoint == 'home' %}active{% endif %}">
            <span>⌂</span>
            الرئيسية
        </a>

        <a href="{{ url_for('games_page') }}" class="nav-item {% if request.endpoint == 'games_page' %}active{% endif %}">
            <span>🎮</span>
            الألعاب
        </a>

        <a href="{{ url_for('library_page') }}" class="nav-item {% if request.endpoint == 'library_page' %}active{% endif %}">
            <span>📚</span>
            مكتبتي
        </a>

        <a href="{{ url_for('profile_page') }}" class="nav-item {% if request.endpoint == 'profile_page' %}active{% endif %}">
            <span>👤</span>
            ملفي
        </a>
    </nav>

    {% block extra_js %}{% endblock %}

</body>
</html>
