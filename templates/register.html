<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | أنيس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="auth-page">
    <main class="auth-card">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-logo">أ</div>
            <h1>أنيس</h1>
            <p>رفيقك لتعلّم العربية</p>
        </div>

        <!-- Register -->
        <div class="auth-content">
            <h2>أنشئ حسابك</h2>
            <p class="auth-subtitle">لنبدأ رحلة تعلّم العربية معًا</p>

            <form id="registerForm">
                <!-- Name -->
                <div class="form-group">
                    <label for="name">الاسم</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="اكتب اسمك"
                            autocomplete="name"
                        >
                    </div>
                </div>

                <!-- Username -->
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✨</span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="اختر اسم مستخدم"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="اختر كلمة مرور"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✓</span>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="أعد كتابة كلمة المرور"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <!-- Message -->
                <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

                <!-- Submit -->
                <button type="submit" id="registerButton" class="btn btn-primary btn-full">
                    إنشاء الحساب
                </button>
            </form>

            <!-- Login -->
            <div class="auth-switch">
                <span>لديك حساب بالفعل؟</span>
                <a href="{{ url_for('login') }}">تسجيل الدخول</a>
            </div>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
